<!DOCTYPE html>
<html>
<head>
  <title>PandaMusic Verify</title>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    if (token) {
      window.location.href = 'pandamusic://verify?token=' + token;
    }
  </script>
</head>
<body style="background:#0A0A0A;color:white;font-family:sans-serif;text-align:center;padding-top:100px">
  <h2>🐼 PandaMusic</h2>
  <p>Verifying your email...</p>
  <p>Opening app automatically...</p>
</body>
</html>
